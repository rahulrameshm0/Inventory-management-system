{% extends "user-dashboard.html" %}
{% load static %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow border-0 text-center p-4">
                <div class="card-body">

                    <!-- Cancel Icon -->
                    <div class="mb-3">
                        <span class="fs-1 text-danger">✖</span>
                    </div>

                    <h2 class="fw-bold text-danger mb-2">
                        Payment Cancelled
                    </h2>

                    <p class="text-muted mb-4">
                        Your payment was not completed. No money has been charged.
                    </p>

                    <div class="d-grid gap-2">
                        <a href="{% url 'payment' %}" class="btn btn-primary">
                            Try Again
                        </a>
                        <a href="{% url 'user' %}" class="btn btn-outline-secondary">
                            Back to Home
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock content %}
