{% extends "user-dashboard.html" %}
{% load static %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <!-- Card -->
            <div class="card shadow-lg border-0">
                <div class="card-body p-4">

                    <h3 class="text-center mb-4 fw-bold">Payment Section</h3>

                    <!-- Course Info -->
                    <div class="mb-4 text-center">  
                        <span class="text-success fw-bold">{{ product.name }}</span><br>
                        <span class="text-success fw-bold">{{ product_price }}$</span>
                    </div>

                    <hr>

                    <!-- Payment Form -->
                    <form method="post" action="{% url 'payment_session' %}">
                        {% csrf_token %}

                        <!-- Stripe price id -->
                        <input type="hidden" name="price_id" value="price_1SuaR9EGORQTetsVIDwHzPur">
                        <input type="hidden" name="quantity" value="1">

                        <button type="submit" class="btn btn-success w-100 py-2">
                            PAY
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock content %}
