{% load static %}
{% load django_bootstrap5 %}
{% bootstrap_css %}
{% block content %}

<body class="bg-dark">
    <div class="container mx-auto" style="width:1000px; margin-top:10rem;">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div class="card bg-dark text-light shadow-lg border-0 rounded-4 p-4 text-center">
                    <div class="card-body">
                        
                        <!-- Success Icon -->
                        <div class="mb-3">
                            <span class="fs-1 text-success">✔</span>
                        </div>
                        
                        <h2 class="fw-bold text-success mb-2">
                            Payment Successful
                        </h2>
                        
                        <p class="text-secondary mb-4">
                            Thank you for your purchase. Your payment has been processed successfully.
                        </p>
                        
                        <div class="d-grid gap-3">
                            <a href="{% url 'user' %}" class="btn btn-success btn-lg rounded-pill">
                                Go to Dashboard
                            </a>
                            <a href="{% url 'user' %}" class="btn btn-outline-light btn-lg rounded-pill">
                                Back to Home
                            </a>
                        </div>
                        
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</body>
    {% endblock content %}
