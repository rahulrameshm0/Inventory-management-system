{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <h1>Inventory Management System</h1>
    <section class="login-section">
        <h2>Login   </h2>
        <form action="" method="POST">
            {% csrf_token %}
            <input type="text" name="username" id="username" required placeholder="Username"><br>
            <input type="password" name="password" id="password" required placeholder="Password"><br>
            <button type="submit">Login</button>
        </form>
          <p style="margin-top: 0.5rem;">Do you have an account?<a style="text-decoration: none; color: rgb(55, 55, 236);" href="{% url 'signup' %}">Create Account</a></p>

          {% if messages %}
          {% for message in messages %}
            <h3 style="color: rgb(237, 75, 75); margin: 0.5rem;"> {{ message }} </h3>  
          {% endfor %}
        {% endif %}
    </section>
</body>
</html>
